[project]
name = "cross-channel-nurture"
version = "0.1.0"
description = "Cross-channel nurture sequences: coordinated email, SMS and Slack orchestration"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "email-validator>=2.1",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
